<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — GallScan AI Diagnostic Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Injected Shared Clinical Disclaimer -->
  <div id="disclaimer-root"></div>

  <!-- Injected Shared Header Navigation & Mobile Drawer -->
  <div id="navbar-root"></div>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 48px 16px;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 32px 24px; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 48px; height: 48px; background: var(--primary-navy); color: var(--accent-cyan-vibrant); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px auto;">
          <span class="material-symbols-outlined" style="font-size: 26px;">lock</span>
        </div>
        <h2 style="font-size: 20px; margin-bottom: 6px;">Sign In to Console</h2>
        <p style="font-size: 13px; color: var(--text-muted);">Access ultrasound classification pipelines & patient archives</p>
      </div>

      <div id="loginAlert" class="alert alert-error" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="doctor@hospital.org" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
            <a href="forgot-password.html" style="font-size: 12px; color: var(--secondary-teal); text-decoration: none; font-weight: 600;">Forgot?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; min-height: 44px;">
          Sign In to Console
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border-light); padding-top: 20px;">
        Don't have an account? <a href="signup.html" style="color: var(--secondary-teal); font-weight: 700; text-decoration: none;">Register now</a>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-disclaimer" style="text-align: center;">
        GallScan AI &copy; 2026. For academic & research evaluation only.
      </div>
    </div>
  </footer>

  <script src="components/navbar.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
