<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — GallScan AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Injected Shared Clinical Disclaimer -->
  <div id="disclaimer-root"></div>

  <!-- Injected Shared Header Navigation & Mobile Drawer -->
  <div id="navbar-root"></div>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 48px 16px;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 32px 24px; box-shadow: var(--shadow-lg);">
      
      <!-- Step 1: Request reset link -->
      <div id="requestResetSection">
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="width: 48px; height: 48px; background: #e6ebf2; color: var(--primary-navy); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px auto;">
            <span class="material-symbols-outlined" style="font-size: 26px;">key</span>
          </div>
          <h2 style="font-size: 20px; margin-bottom: 6px;">Password Recovery</h2>
          <p style="font-size: 13px; color: var(--text-muted);">Enter your registered email address to receive password reset instructions.</p>
        </div>

        <div id="forgotAlert" class="alert alert-error" style="display: none;"></div>
        <div id="forgotSuccess" class="alert alert-success" style="display: none;"></div>

        <form id="forgotPasswordForm">
          <div class="form-group">
            <label class="form-label" for="forgotEmail">Institutional Email</label>
            <input type="email" id="forgotEmail" class="form-control" placeholder="doctor@hospital.org" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; min-height: 44px;">
            Send Password Reset Link
          </button>
        </form>
      </div>

      <!-- Step 2: Enter token & new password -->
      <div id="confirmResetSection" style="margin-top: 28px; border-top: 1px solid var(--border-light); padding-top: 20px;">
        <div class="label-caps" style="color: var(--secondary-teal); margin-bottom: 8px;">Direct Token Reset</div>
        <div id="resetAlert" class="alert alert-error" style="display: none;"></div>
        <div id="resetSuccess" class="alert alert-success" style="display: none;"></div>

        <form id="resetPasswordForm">
          <div class="form-group">
            <label class="form-label" for="resetToken">Reset Token</label>
            <input type="text" id="resetToken" class="form-control mono-text" placeholder="Paste reset token here" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="newPassword">New Password</label>
            <input type="password" id="newPassword" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
          </div>

          <button type="submit" class="btn btn-secondary" style="width: 100%; min-height: 44px;">
            Confirm & Save New Password
          </button>
        </form>
      </div>

      <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted);">
        Remember your password? <a href="login.html" style="color: var(--secondary-teal); font-weight: 700; text-decoration: none;">Sign in here</a>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-disclaimer" style="text-align: center;">
        GallScan AI &copy; 2026. For academic & research evaluation only.
      </div>
    </div>
  </footer>

  <script src="components/navbar.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
